<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Картка співробітника</title>
    <style>
        body {
            text-align: center;
            color: #909090;
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .card {
            width: 400px;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 30px #32326440;
            background-color: #ffffff;
            margin: 0 auto;
            text-align: center;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .card h3 {
            color: #222;
            margin: 16px 0 6px 0;
            font-size: 20px;
        }

        .card .role {
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        .card .description {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .card hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 16px 0 12px 0;
        }

        .card-footer {
            text-align: right;
        }

        .card a {
            color: #5d5dff;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }

        .card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Картка співробітника</h1>

    <div class="card">
        <img src="kot.jpg" alt="Фото профілю">
        
        <h3>Катерина Пономаренко</h3>
        <div class="role">QA Manual / Веб-розробник</div>
        <div class="description">Вивчаю ручне тестування та веб-розробку, пишу код, працюю з гілками в Git та створюю проєкти на GitHub.</div>
        
        <hr>
        
        <div class="card-footer">
            <a href="https://github.com/ponomarenkokaterina88-spec" target="_blank">Детальніше</a>
        </div>
    </div>

</body>
</html>
